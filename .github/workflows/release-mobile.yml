# Build EAS (Android APK uniquement) puis publication sur une GitHub Release
# (aucun binaire à la racine du dépôt).
#
# Prérequis dépôt : secret EXPO_TOKEN (https://expo.dev/accounts/[compte]/settings/access-tokens)
#
name: Release mobile (EAS → GitHub Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex. v1.0.1). Crée la release si elle n’existe pas.'
        required: true
        type: string
  # Push d’un tag sémantique → build Android + release GitHub
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-mobile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  eas-build-and-release:
    name: EAS build + upload release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install monorepo dependencies
        run: yarn install --immutable

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare artifacts directory
        run: mkdir -p "${{ github.workspace }}/artifacts"

      - name: Définir le tag de release
        id: cfg
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build + download (Android)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(eas build --platform android --profile preview --wait --non-interactive --json)"
          ID="$(echo "$JSON" | jq -er '(if type == "array" then .[0] else . end).id')"
          DEST="${{ github.workspace }}/artifacts"
          mkdir -p "$DEST"
          # EAS place l’artefact dans son cache (/tmp/.../eas-build-run-cache/…), pas dans le cwd.
          DL_JSON="$(eas build:download --non-interactive --build-id "$ID" --json)"
          BIN_PATH="$(echo "$DL_JSON" | jq -er '.path')"
          if [[ ! -f "$BIN_PATH" ]]; then
            echo "::error::APK introuvable après eas build:download (path=$BIN_PATH)"
            exit 1
          fi
          cp "$BIN_PATH" "$DEST/Voliere-Manager-android.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cfg.outputs.tag }}"
          ROOT="${{ github.workspace }}"
          NOTES="$ROOT/artifacts/release-notes.md"
          {
            echo "## Volière Manager — binaires mobiles (EAS)"
            echo ""
            echo "- **Profil** : \`preview\` (distribution interne)"
            echo "- **Plateforme** : Android (APK)"
            echo "- **Workflow** : [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "### Installation"
            echo "- **Android** : télécharger l’APK, transférer sur l’appareil, autoriser les sources inconnues si demandé."
          } > "$NOTES"

          APK="$ROOT/artifacts/Voliere-Manager-android.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::APK absent sous $APK"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existe — ajout / remplacement du fichier."
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "${{ github.sha }}" --title "Mobile $TAG" --notes-file "$NOTES"
          fi
